
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Mobile Cloud App</title>

<style>
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
    font-family: Arial, sans-serif;
}

body {
    background: #f1f5f9;
    color: #172033;
    padding: 20px;
}

.container {
    max-width: 900px;
    margin: auto;
}

header {
    background: #172033;
    color: white;
    padding: 25px;
    border-radius: 15px;
    margin-bottom: 20px;
}

header p {
    color: #cbd5e1;
    margin-top: 8px;
}

.card {
    background: white;
    padding: 22px;
    border-radius: 14px;
    margin-bottom: 20px;
    box-shadow: 0 3px 12px #0001;
}

h2 {
    margin-bottom: 15px;
}

input {
    width: 100%;
    padding: 13px;
    margin: 8px 0;
    border: 1px solid #cbd5e1;
    border-radius: 8px;
}

button {
    padding: 12px 18px;
    border: none;
    border-radius: 8px;
    cursor: pointer;
    margin: 5px 3px 5px 0;
    font-weight: bold;
}

.primary {
    background: #2563eb;
    color: white;
}

.secondary {
    background: #e2e8f0;
    color: #172033;
}

.danger {
    background: #fee2e2;
    color: #b91c1c;
}

.hidden {
    display: none;
}

#message {
    padding: 12px;
    background: #dbeafe;
    border-radius: 8px;
    margin-bottom: 15px;
    overflow-wrap: anywhere;
}

.task {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 13px;
    border-bottom: 1px solid #e2e8f0;
    gap: 10px;
}

.task span {
    overflow-wrap: anywhere;
}

.api-item {
    background: #f8fafc;
    padding: 14px;
    margin-top: 12px;
    border-radius: 8px;
}

.api-item h4 {
    margin-bottom: 8px;
}

#taskList, #apiResult {
    margin-top: 15px;
}

@media(max-width: 550px) {
    body {
        padding: 10px;
    }

    .task {
        align-items: flex-start;
        flex-direction: column;
    }
}
</style>
</head>

<body>

<div class="container">

<header>
    <h1>☁️ Mobile Cloud App</h1>
    <p>Firebase Authentication | Cloud Database | REST API</p>
</header>

<div id="message">Initializing application...</div>

<!-- AUTHENTICATION SECTION -->

<div class="card" id="authSection">

    <h2>🔐 User Authentication</h2>

    <input
        type="email"
        id="email"
        placeholder="Enter your email"
    >

    <input
        type="password"
        id="password"
        placeholder="Enter password (minimum 6 characters)"
    >

    <button class="primary" id="registerBtn">
        Register
    </button>

    <button class="secondary" id="loginBtn">
        Login
    </button>

</div>

<!-- DASHBOARD -->

<div class="card hidden" id="dashboard">

    <h2>Welcome to Your Dashboard!</h2>

    <p id="userEmail"></p>

    <button class="danger" id="logoutBtn">
        Logout
    </button>

    <hr style="margin:20px 0">

    <h2>📝 Cloud Task Manager</h2>

    <input
        type="text"
        id="taskInput"
        placeholder="Enter a new task"
    >

    <button class="primary" id="addTaskBtn">
        Add Task
    </button>

    <div id="taskList"></div>

</div>

<!-- REST API SECTION -->

<div class="card">

    <h2>🌐 REST API Integration</h2>

    <p>Fetch sample data from a public REST API.</p>

    <button class="primary" id="apiBtn">
        Fetch API Data
    </button>

    <div id="apiResult"></div>

</div>

</div>

<script type="module">

// FIREBASE IMPORTS

import { initializeApp }
from "https://www.gstatic.com/firebasejs/12.6.0/firebase-app.js";

import {
    getAuth,
    createUserWithEmailAndPassword,
    signInWithEmailAndPassword,
    signOut,
    onAuthStateChanged
}
from "https://www.gstatic.com/firebasejs/12.6.0/firebase-auth.js";

import {
    getFirestore,
    collection,
    addDoc,
    deleteDoc,
    doc,
    onSnapshot,
    serverTimestamp
}
from "https://www.gstatic.com/firebasejs/12.6.0/firebase-firestore.js";


// FIREBASE CONFIGURATION

const firebaseConfig = {
    apiKey: "YOUR_API_KEY",
    authDomain: "YOUR_PROJECT_ID.firebaseapp.com",
    projectId: "YOUR_PROJECT_ID",
    storageBucket: "YOUR_STORAGE_BUCKET",
    messagingSenderId: "YOUR_SENDER_ID",
    appId: "YOUR_APP_ID"
};


// INITIALIZE FIREBASE

const app = initializeApp(firebaseConfig);

const auth = getAuth(app);

const db = getFirestore(app);


// HTML ELEMENTS

const message = document.getElementById("message");

const authSection = document.getElementById("authSection");

const dashboard = document.getElementById("dashboard");

function showMessage(text) {
    message.textContent = text;
}


// USER REGISTRATION

document.getElementById("registerBtn")
.addEventListener("click", async () => {

    const email = document.getElementById("email").value.trim();

    const password = document.getElementById("password").value;

    if (!email || !password) {
        showMessage("Please enter email and password.");
        return;
    }

    try {

        await createUserWithEmailAndPassword(
            auth,
            email,
            password
        );

        showMessage("Registration successful!");

    } catch (error) {

        showMessage(error.message);

    }

});


// USER LOGIN

document.getElementById("loginBtn")
.addEventListener("click", async () => {

    const email = document.getElementById("email").value.trim();

    const password = document.getElementById("password").value;

    if (!email || !password) {
        showMessage("Please enter email and password.");
        return;
    }

    try {

        await signInWithEmailAndPassword(
            auth,
            email,
            password
        );

        showMessage("Login successful!");

    } catch (error) {

        showMessage(error.message);

    }

});


// AUTHENTICATION STATE

let unsubscribeTasks = null;

onAuthStateChanged(auth, user => {

    if (unsubscribeTasks) {
        unsubscribeTasks();
        unsubscribeTasks = null;
    }

    if (user) {

        authSection.classList.add("hidden");

        dashboard.classList.remove("hidden");

        document.getElementById("userEmail").textContent =
            "Logged in as: " + user.email;

        showMessage("Welcome! You are logged in.");

        loadTasks(user.uid);

    } else {

        authSection.classList.remove("hidden");

        dashboard.classList.add("hidden");

        document.getElementById("taskList").innerHTML = "";

        showMessage("Please register or login.");

    }

});


// LOGOUT

document.getElementById("logoutBtn")
.addEventListener("click", async () => {

    try {

        await signOut(auth);

        showMessage("Logged out successfully.");

    } catch (error) {

        showMessage(error.message);

    }

});


// USER TASK COLLECTION

function getUserTasks(uid) {

    return collection(
        db,
        "users",
        uid,
        "tasks"
    );

}


// ADD TASK TO FIRESTORE

document.getElementById("addTaskBtn")
.addEventListener("click", async () => {

    const user = auth.currentUser;

    if (!user) return;

    const taskInput = document.getElementById("taskInput");

    const task = taskInput.value.trim();

    if (!task) {
        showMessage("Please enter a task.");
        return;
    }

    try {

        await addDoc(getUserTasks(user.uid), {

            title: task,

            createdAt: serverTimestamp()

        });

        taskInput.value = "";

        showMessage("Task saved to Firebase Cloud!");

    } catch (error) {

        showMessage(error.message);

    }

});


// READ TASKS FROM FIRESTORE

function loadTasks(uid) {

    unsubscribeTasks = onSnapshot(

        getUserTasks(uid),

        snapshot => {

            const list = document.getElementById("taskList");

            list.innerHTML = "";

            if (snapshot.empty) {

                list.textContent = "No tasks available.";

                return;

            }

            snapshot.forEach(item => {

                const task = item.data();

                const div = document.createElement("div");

                div.className = "task";

                const title = document.createElement("span");

                title.textContent = task.title;

                const deleteButton = document.createElement("button");

                deleteButton.className = "danger";

                deleteButton.textContent = "Delete";

                deleteButton.addEventListener("click", async () => {

                    try {

                        await deleteDoc(
                            doc(
                                db,
                                "users",
                                uid,
                                "tasks",
                                item.id
                            )
                        );

                        showMessage("Task deleted successfully.");

                    } catch (error) {

                        showMessage(error.message);

                    }

                });

                div.append(title, deleteButton);

                list.appendChild(div);

            });

        },

        error => {

            showMessage("Database error: " + error.message);

        }

    );

}


// REST API INTEGRATION

document.getElementById("apiBtn")
.addEventListener("click", async () => {

    const result = document.getElementById("apiResult");

    result.textContent = "Loading API data...";

    try {

        const response = await fetch(
            "https://jsonplaceholder.typicode.com/posts?_limit=5"
        );

        if (!response.ok) {

            throw new Error("API request failed.");

        }

        const data = await response.json();

        result.innerHTML = "";

        data.forEach(post => {

            const div = document.createElement("div");

            div.className = "api-item";

            const heading = document.createElement("h4");

            heading.textContent = post.title;

            const paragraph = document.createElement("p");

            paragraph.textContent = post.body;

            div.append(heading, paragraph);

            result.appendChild(div);

        });

        showMessage(
            "API successful! " + data.length +
            " JSON records received."
        );

    } catch (error) {

        result.textContent = error.message;

        showMessage("Unable to fetch API data.");

    }

});

</script>

</body>
</html>
